services:
  sion:
    build:
      context: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /app/data/sion.sqlite
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - sion_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/zonas').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  sion_data:
